<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>METAR TAF Provence</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root { --blue:#1ea0e6; --navy:#0a1a4a; --cream:#fffff0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; font-family:Verdana, Arial, sans-serif; background:#cfd6dc; }
  #page {
    display:grid; height:100vh; gap:8px; padding:8px;
    grid-template-columns: minmax(260px,22vw) 1fr minmax(260px,22vw);
    grid-template-rows: auto 1fr auto;
    grid-template-areas: "top top top" "left map right" "bot bot bot";
  }
  #top,#bot { display:flex; gap:8px; }
  #top{grid-area:top} #bot{grid-area:bot}
  #left{grid-area:left} #right{grid-area:right}
  #left,#right { display:flex; flex-direction:column; justify-content:center; gap:8px; }
  #top .card,#bot .card { flex:1; min-width:0; }
  #map { grid-area:map; border:2px solid var(--blue); min-height:200px; }
  #lines { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:500; }
  .card {
    position:relative; z-index:600; background:var(--cream); color:var(--navy);
    border:3px solid var(--blue); box-shadow:4px 4px 0 rgba(0,0,0,.35);
    font-size:11px; line-height:1.35;
  }
  .card h2 { margin:0; background:var(--blue); color:#000; font-size:13px; padding:3px 6px; font-weight:bold; }
  .card h2 small { font-weight:normal; }
  .card h2 .tc { float:right; background:#fff!important; color:#000!important; font-size:11px; padding:0 6px; border:1px solid #000; }
  .card .body { padding:4px 7px 6px; font-weight:bold; word-wrap:break-word; }
  .card .lbl { font-size:14px; font-weight:bold; }
  .card .taf { margin-top:4px; color:#4a5068; background:#f3f3ec; padding:1px 3px; }
  .card .err { color:#b00; }
  .icao-lbl { background:var(--blue); color:#fff; font:bold 11px Verdana; padding:1px 3px; white-space:nowrap; border:1px solid #fff; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--blue); border:2px solid #fff; }
  #status { position:fixed; left:12px; bottom:12px; font:bold 11px Verdana; color:#333; z-index:700;
            background:rgba(255,255,255,.9); padding:3px 7px; border:2px solid #999; max-width:calc(100% - 24px); }
  #status.ok { color:#fff; background:#00a040; border-color:#fff; }
  #status.warn { color:#000; background:#ffc000; border-color:#fff; }
  #status.bad { color:#fff; background:#d00000; border-color:#fff; }
  /* Mode "sur la carte" : carte plein écran, encarts à côté des AD */
  body.onmap #page { grid-template-columns:1fr; grid-template-rows:1fr; grid-template-areas:"map"; }
  body.onmap #top, body.onmap #bot, body.onmap #left, body.onmap #right { display:contents; }
  body.onmap .card { position:fixed; width:250px; font-size:10px; line-height:1.3; }
  body.onmap .card .lbl { font-size:12px; }
  body.onmap .card h2 { font-size:12px; padding:2px 5px; }
  html, body { height:100%; overflow:hidden; }
  body.onmap #page { height:100dvh; }
  /* Tablette : encarts plus étroits */
  @media (max-width:1100px){
    body.onmap .card { width:205px; font-size:9px; }
    body.onmap .card .lbl { font-size:10.5px; }
    body.onmap .card h2 { font-size:11px; }
  }
  #phoneMode { position:fixed; top:10px; right:10px; z-index:950; background:#1ea0e6; color:#fff; border:2px solid #fff;
    font:bold 11px Verdana; padding:4px 8px; box-shadow:2px 2px 0 rgba(0,0,0,.35); }
  /* Téléphone : encarts ouverts mais réduits */
  @media (max-width:700px){
    body.onmap:not(.compact) .card { width:168px; font-size:7.5px; line-height:1.2; border-width:2px; box-shadow:2px 2px 0 rgba(0,0,0,.35); }
    body.onmap:not(.compact) .card .lbl { font-size:8.5px; }
    body.onmap:not(.compact) .card h2 { font-size:9px; padding:1px 3px; }
    body.onmap:not(.compact) .card h2 .tc { font-size:7.5px; padding:0 3px; }
    body.onmap:not(.compact) .card .body { padding:2px 4px 3px; }
    body.onmap:not(.compact) .card .taf { margin-top:2px; }
  }
  /* Téléphone, mode étiquettes : étiquettes compactes sur la carte, détail au toucher en bas d'écran */
  body.compact #page { padding:0; }
  body.compact #map { border:0; }
  body.compact .card:not(.open) { display:none; }
  body.compact #lines { display:none; }
  body.compact .icao-lbl { font-size:13px; padding:3px 5px; cursor:pointer; }
  body.compact .card { width:auto; cursor:pointer; box-shadow:2px 2px 0 rgba(0,0,0,.35); border-width:2px; }
  body.compact .card h2 { font-size:11px; padding:2px 4px; white-space:nowrap; }
  body.compact .card h2 small, body.compact .card .body { display:none; }
  body.compact .card h2 .tc { float:none; margin-left:5px; font-size:9px; padding:0 3px; }
  body.compact .card.open { position:fixed; left:6px!important; right:6px; top:auto!important; bottom:6px; width:auto;
    z-index:900; font-size:11px; box-shadow:0 0 0 100vmax rgba(0,0,0,.25); }
  body.compact .card.open h2 small, body.compact .card.open .body { display:block; }
  body.compact .card.open h2 small { display:inline; }
  body.compact .card.open h2 { white-space:normal; }
  body.compact .card.open h2::after { content:'✕'; float:right; margin-left:8px; }
  body.compact #status { left:6px; bottom:6px; }
</style>
</head>
<body class="onmap">
<div id="page">
  <div id="top"></div>
  <div id="left"></div>
  <div id="map"></div>
  <div id="right"></div>
  <div id="bot"></div>
</div>
<svg id="lines"></svg>
<div id="status">Chargement…</div>
<button id="phoneMode" style="display:none"></button>

<script>
// Placement des cartes autour de la carte, selon la géographie
const AD = [
  {id:'LFTW', name:'NIMES GARONS',        lat:43.7574, lon:4.4163, slot:'top'},
  {id:'LFMO', name:'ORANGE CARITAT',      lat:44.1405, lon:4.8667, slot:'top'},
  {id:'LFMV', name:'AVIGNON CAUMONT',     lat:43.9073, lon:4.9018, slot:'top'},
  {id:'LFMY', name:'SALON DE PROVENCE',   lat:43.6064, lon:5.1093, slot:'top'},
  {id:'LFMT', name:'MONTPELLIER',         lat:43.5762, lon:3.9630, slot:'left'},
  {id:'LFMC', name:'LE LUC LE CANNET',    lat:43.3847, lon:6.3872, slot:'right'},
  {id:'LFMI', name:'ISTRES LE TUBE',      lat:43.5227, lon:4.9238, slot:'bot'},
  {id:'LFML', name:'MARSEILLE PROVENCE',  lat:43.4393, lon:5.2214, slot:'bot'},
  {id:'LFTH', name:'TOULON HYERES',       lat:43.0973, lon:6.1460, slot:'bot'},
];

const map = L.map('map', {zoomControl:true, zoomSnap:0.25, zoomDelta:0.5});
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:13, attribution:'Tiles © Esri'
}).addTo(map);

AD.forEach(a => {
  const html = `<div style="display:flex;flex-direction:column;align-items:center"><span class="icao-lbl">${a.id}</span><div class="dot"></div></div>`;
  a.marker = L.marker([a.lat,a.lon], {icon:L.divIcon({html, className:'', iconSize:[40,30], iconAnchor:[20,25]})}).addTo(map);
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<h2>${a.id} <small>– ${a.name}</small><span class="tc" style="display:none"></span></h2><div class="body">Chargement…</div>`;
  document.getElementById(a.slot).appendChild(c);
  a.card = c;
});

const onMap = () => true;
// Téléphone : encarts ouverts par défaut, bouton pour passer en étiquettes seules
const isPhone = () => innerWidth <= 700 || innerHeight < 450;
let phoneLabels = false;
try { phoneLabels = localStorage.getItem('phoneLabels') === '1'; } catch(e) {}
const isCompact = () => isPhone() && phoneLabels;
const btn = document.getElementById('phoneMode');
btn.onclick = () => {
  phoneLabels = !phoneLabels;
  try { localStorage.setItem('phoneLabels', phoneLabels ? '1' : '0'); } catch(e) {}
  applyCompact(); fit(); layout();
};
function applyCompact(){
  const c = isCompact();
  document.body.classList.toggle('compact', c);
  btn.style.display = isPhone() ? '' : 'none';
  btn.textContent = c ? 'Afficher les encarts' : 'Étiquettes seules';
  if (!c) AD.forEach(a => a.card.classList.remove('open'));
}
// Téléphone : toucher un terrain ouvre son détail en bas d'écran ; toucher le détail ou la carte le ferme
function toggleCard(a){
  if (!isCompact()) return;
  const was = a.card.classList.contains('open');
  AD.forEach(b => b.card.classList.remove('open'));
  if (!was) { a.card.classList.add('open'); a.card.style.left = a.card.style.top = ''; }
}
AD.forEach(a => {
  a.card.addEventListener('click', e => { e.stopPropagation(); toggleCard(a); });
  a.marker.on('click', e => { L.DomEvent.stopPropagation(e); toggleCard(a); });
});
map.on('click', () => AD.forEach(b => b.card.classList.remove('open')));
function fit(){
  const pts = AD.map(a=>[a.lat,a.lon]);
  const cw = isCompact() ? 50 : Math.min(270, innerWidth * .2), ch = isCompact() ? 40 : Math.min(150, innerHeight * .17);
  map.fitBounds(pts, {paddingTopLeft:[cw, ch], paddingBottomRight:[cw, ch]});
}

// Placement des encarts à côté des AD : sans chevauchement, en évitant que les traits se croisent
// ou passent sous un autre encart. On essaie plusieurs ordres de placement et on garde le meilleur.
function segHit(a, b, c, d){ // les segments ab et cd se croisent-ils ?
  const o = (p, q, r) => Math.sign((q.x-p.x)*(r.y-p.y) - (q.y-p.y)*(r.x-p.x));
  return o(a,b,c) !== o(a,b,d) && o(c,d,a) !== o(c,d,b);
}
function segRect(a, b, r){ // le segment ab traverse-t-il le rectangle r ?
  const inside = p => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
  if (inside(a) || inside(b)) return true;
  const c = [{x:r.x,y:r.y},{x:r.x+r.w,y:r.y},{x:r.x+r.w,y:r.y+r.h},{x:r.x,y:r.y+r.h}];
  return c.some((p,i) => segHit(a, b, p, c[(i+1)%4]));
}
const anchor = (p, r) => ({x: Math.min(Math.max(p.x, r.x), r.x + r.w), y: Math.min(Math.max(p.y, r.y), r.y + r.h)});

function placeCards(){
  if (isCompact()) return; // téléphone : pas d'encarts sur la carte
  if (!onMap()) { AD.forEach(a => { a.card.style.left = a.card.style.top = ''; }); return; }
  const mr = document.getElementById('map').getBoundingClientRect();
  const M = 6;
  const hit = (a, b) => a.x < b.x + b.w + M && b.x < a.x + a.w + M && a.y < b.y + b.h + M && b.y < a.y + a.h + M;
  const pts = AD.map(a => { const p = map.latLngToContainerPoint([a.lat,a.lon]); return {x: mr.left + p.x, y: mr.top + p.y}; });
  const cx = pts.reduce((s,p)=>s+p.x,0)/pts.length, cy = pts.reduce((s,p)=>s+p.y,0)/pts.length;
  const labels = pts.map(p => ({x:p.x-24, y:p.y-29, w:48, h:40})); // étiquette 4 lettres + point
  const opened = AD.find(a => a.card.classList.contains('open'));
  opened?.card.classList.remove('open'); // mesurer l'étiquette fermée
  const sizes = AD.map(a => ({w: a.card.offsetWidth, h: a.card.offsetHeight}));
  opened?.card.classList.add('open');

  // positions candidates pour chaque AD (calculées une fois)
  const cands = AD.map((a, i) => {
    const p = pts[i], {w, h} = sizes[i], away = Math.atan2(p.y - cy, p.x - cx), list = [];
    for (let d = 14; d <= 360; d += 20) for (let k = 0; k < 24; k++) {
      const ang = k * Math.PI / 12, ex = Math.cos(ang), ey = Math.sin(ang);
      const t = Math.min(Math.abs(ex) > 1e-6 ? (w/2)/Math.abs(ex) : 1e9, Math.abs(ey) > 1e-6 ? (h/2)/Math.abs(ey) : 1e9);
      const r = {x: p.x + ex*(t+d) - w/2, y: p.y + ey*(t+d) - h/2, w, h};
      if (r.x < mr.left + 4 || r.y < mr.top + 4 || r.x + w > mr.right - 4 || r.y + h > mr.bottom - 4) continue;
      let diff = Math.abs(ang - away) % (2*Math.PI); if (diff > Math.PI) diff = 2*Math.PI - diff;
      if (labels.some(l => hit(r, l))) continue; // jamais sur un terrain (y compris le sien)
      r.base = d * 1.5 + diff * 40;
      r.end = anchor(p, r);
      list.push(r);
    }
    return list.sort((x, y) => x.base - y.base).slice(0, 160);
  });

  function run(order){
    const res = [], segs = [];
    let total = 0;
    for (const i of order) {
      const p = pts[i];
      let best = null, bs = Infinity;
      for (const r of cands[i]) {
        if (r.base >= bs) break; // liste triée : plus rien de mieux
        let s = r.base;
        for (const j in res) {
          const q = res[j];
          if (hit(r, q)) s += 10000;
          if (segHit(p, r.end, pts[j], q.end)) s += 2500;       // traits qui se croisent
          if (segRect(p, r.end, q)) s += 1500;                  // mon trait passe sous un encart
          if (segRect(pts[j], q.end, r)) s += 1500;             // mon encart couvre un trait
          if (s >= bs) break;
        }
        if (s < bs) { bs = s; best = r; }
      }
      best ??= {x: p.x + 20, y: p.y + 20, ...sizes[i], end: p};
      res[i] = best; total += bs;
    }
    return {res, total};
  }

  // ordres essayés : excentrés d'abord, centraux d'abord, puis des variantes aléatoires (reproductibles)
  const byDist = AD.map((a,i)=>i).sort((i,j) => Math.hypot(pts[j].x-cx, pts[j].y-cy) - Math.hypot(pts[i].x-cx, pts[i].y-cy));
  const orders = [byDist, [...byDist].reverse()];
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let n = 0; n < 60; n++) orders.push([...byDist].sort(() => rnd() - .5));
  let best = null;
  for (const o of orders) { const r = run(o); if (!best || r.total < best.total) best = r; }
  AD.forEach((a, i) => { a.card.style.left = best.res[i].x + 'px'; a.card.style.top = best.res[i].y + 'px'; });
  AD.forEach(a => { if (a.card.classList.contains('open')) { a.card.style.left = a.card.style.top = ''; } });
}

function layout(){ placeCards(); drawLines(); }

// Lignes de rappel carte -> aéroport
function drawLines(){
  const svg = document.getElementById('lines');
  const mr = document.getElementById('map').getBoundingClientRect();
  let s = '';
  AD.forEach(a => {
    const p = map.latLngToContainerPoint([a.lat,a.lon]);
    const x2 = mr.left + p.x, y2 = mr.top + p.y;
    if (x2<mr.left||x2>mr.right||y2<mr.top||y2>mr.bottom) return;
    if (a.card.classList.contains('open')) return;
    const r = a.card.getBoundingClientRect();
    const x1 = Math.min(Math.max(x2, r.left), r.right);
    const y1 = Math.min(Math.max(y2, r.top), r.bottom);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${a.color || '#1ea0e6'}" stroke-width="2" stroke-dasharray="4 3" opacity=".8"/>`;
  });
  svg.innerHTML = s;
}
map.on('move', drawLines);
map.on('moveend zoomend resize', layout);
window.addEventListener('resize', () => { applyCompact(); map.invalidateSize(); fit(); layout(); });

// Couleurs terrain : la pire des deux (visibilité / base des nuages BKN, OVC, VV)
const COLORS = [
  {n:'ROUGE', bg:'#ff0000', fg:'#fff', vis:0,    cld:0},
  {n:'AMBRE', bg:'#953735', fg:'#fff', vis:800,  cld:200},
  {n:'JAUNE', bg:'#ffff00', fg:'#000', vis:1600, cld:300},
  {n:'VERT',  bg:'#00b050', fg:'#000', vis:3700, cld:700},
  {n:'BLANC', bg:'#f2f2f2', fg:'#000', vis:5000, cld:1500},
  {n:'BLEU',  bg:'#0070c0', fg:'#fff', vis:8000, cld:2500},
];
function terrainColor(raw){
  const body = raw.split(/\s(?:TEMPO|BECMG|NOSIG)\b/)[0];
  let vis = Infinity, cld = Infinity;
  if (/\bCAVOK\b/.test(body)) vis = 10000;
  const v = body.match(/\s(\d{4})(?:NDV)?\s/);
  if (v) vis = v[1] === '9999' ? 10000 : +v[1];
  for (const m of body.matchAll(/\b(?:BKN|OVC|VV)(\d{3})\b/g)) cld = Math.min(cld, +m[1]*100);
  let i = COLORS.length - 1;
  while (i > 0 && (vis < COLORS[i].vis || cld < COLORS[i].cld)) i--;
  return COLORS[i];
}

const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// ---------- Récupération des données en direct, à chaque ouverture (rien n'est stocké) ----------
// Ogimet et la NOAA refusent l'accès direct depuis un navigateur (CORS) : on passe par des relais
// publics, tous interrogés en parallèle. VATSIM accepte l'accès direct mais ne fournit que les METAR.
const RELAYS = [
  u => ({url:'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)}),
  u => ({url:'https://api.allorigins.win/get?url=' + encodeURIComponent(u), wrap:true}),
  u => ({url:'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u)}),
  u => ({url:'https://api.cors.lol/?url=' + encodeURIComponent(u)}),
  u => ({url:'https://everyorigin.jwvbremen.nl/api/get?url=' + encodeURIComponent(u), wrap:true}),
  u => ({url:'https://whateverorigin.org/get?url=' + encodeURIComponent(u), wrap:true}),
  u => ({url:'https://proxy.corsfix.com/?' + u}),
  u => ({url:'https://cors.eu.org/' + u}),
  u => ({url:'https://thingproxy.freeboard.io/fetch/' + u}),
  u => ({url:'https://corsproxy.io/?url=' + encodeURIComponent(u)}),
];

async function fetchText(url, check){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 15000);
  try {
    return await Promise.any(RELAYS.map(async f => {
      const {url:u, wrap} = f(url);
      const r = await fetch(u, {signal: ctrl.signal});
      if (!r.ok) throw 0;
      let t = await r.text();
      if (wrap) t = JSON.parse(t).contents;
      if (!t || !check(t)) throw 0;
      ctrl.abort(); // premier relais qui répond : on annule les autres
      return t;
    }));
  } catch(e) { return null; }
  finally { clearTimeout(timer); }
}

const IDS = AD.map(a => a.id);
const strip = (s, re) => s.replace(re, '').replace(/\s+/g,' ').trim();

// Date d'un groupe JJHHMM (mois déduit par rapport à maintenant)
function dayTime(dd, hh, mm = 0){
  const now = new Date(), d = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), dd, hh, mm));
  if (d - now > 15 * 864e5) d.setUTCMonth(d.getUTCMonth() - 1);
  if (now - d > 15 * 864e5) d.setUTCMonth(d.getUTCMonth() + 1);
  return d;
}
const obsTime = raw => { const m = raw?.match(/\s(\d{2})(\d{2})(\d{2})Z\s/); return m ? dayTime(+m[1], +m[2], +m[3]) : null; };
function tafInfo(raw){
  const v = raw.match(/\s(\d{2})(\d{2})\/(\d{2})(\d{2})\s/);
  if (!v) return null;
  const from = dayTime(+v[1], +v[2] % 24), to = dayTime(+v[3], +v[4] % 24);
  if (+v[4] === 24) to.setUTCDate(to.getUTCDate() + 1);
  return {to, issued: obsTime(raw) || from, hours: (to - from) / 36e5};
}

// Source A : VATSIM, accès direct (METAR seulement, parfois en retard d'un message)
async function srcVATSIM(){
  const out = {};
  try {
    const r = await fetch('https://metar.vatsim.net/' + IDS.join(','), {signal: AbortSignal.timeout(10000)});
    if (r.ok) for (const line of (await r.text()).split('\n')) {
      const id = line.slice(0, 4);
      if (IDS.includes(id)) out[id] = {metar: line.trim()};
    }
  } catch(e) {}
  return out;
}

// Source A2 : API CheckWX, accès direct avec clé (offre gratuite : 200 requêtes/jour).
// 2 requêtes par appel (METAR + TAF des 9 terrains) ; appelée au plus toutes les 10 min pour ménager le quota.
const CHECKWX_KEY = 'ffa4e2df78b44b0cafaa5b780b7184b8'; // ← coller ici la clé API CheckWX
let checkwxCache = null, checkwxAt = 0;
async function srcCheckWX(){
  if (!CHECKWX_KEY) return {};
  if (checkwxCache && Date.now() - checkwxAt < 10 * 6e4) return checkwxCache;
  const out = {};
  const get = async kind => {
    try {
      const r = await fetch(`https://api.checkwx.com/${kind}/${IDS.join(',')}`,
        {headers: {'X-API-Key': CHECKWX_KEY}, signal: AbortSignal.timeout(10000)});
      return r.ok ? (await r.json()).data || [] : [];
    } catch(e) { return []; }
  };
  const [m, t] = await Promise.all([get('metar'), get('taf')]);
  for (const raw of m) { const id = raw.match(/^(?:(?:METAR|SPECI|COR)\s+)*([A-Z]{4})\s/)?.[1]; if (IDS.includes(id)) (out[id] ??= {}).metar = raw; }
  for (const raw of t) {
    const id = raw.match(/^(?:(?:TAF|AMD|COR)\s+)*([A-Z]{4})\s/)?.[1], i = tafInfo(raw);
    if (IDS.includes(id) && i) (out[id] ??= {})[i.hours <= 12 ? 'tafc' : 'taf'] = raw;
  }
  if (m.length || t.length) { checkwxCache = out; checkwxAt = Date.now(); }
  return out;
}

// Source B : Ogimet via relais (METAR/SPECI + TAF court et long, une seule requête)
async function srcOgimet(){
  const out = {}, now = new Date(), s = new Date(now - 30 * 36e5);
  const p = (d, k) => String(d['getUTC' + k]() + (k === 'Month' ? 1 : 0)).padStart(2, '0');
  const url = 'https://www.ogimet.com/display_metars2.php?lang=en&tipo=ALL&ord=REV&nil=SI&fmt=txt&send=send'
    + '&lugar=' + IDS.join('+')
    + `&ano=${s.getUTCFullYear()}&mes=${p(s,'Month')}&day=${p(s,'Date')}&hora=${p(s,'Hours')}`
    + `&anof=${now.getUTCFullYear()}&mesf=${p(now,'Month')}&dayf=${p(now,'Date')}&horaf=23&minf=59`;
  const txt = await fetchText(url, t => /^\d{12}\s+(METAR|SPECI|TAF)/m.test(t));
  if (!txt) return out;
  const msgs = [];
  for (const line of txt.split('\n')) {
    if (line.startsWith('#')) continue;
    const m = line.match(/^(\d{12})\s+(.*)$/);
    if (m) msgs.push(m[2].trim());
    else if (msgs.length && line.trim()) msgs[msgs.length - 1] += ' ' + line.trim();
  }
  const seen = {};
  for (let raw of msgs) {
    raw = raw.replace(/=\s*$/, '').replace(/\s+/g, ' ');
    const m = raw.match(/^(METAR|SPECI|TAF)\s+(?:(?:COR|AMD)\s+)*([A-Z]{4})\s/);
    if (!m || !IDS.includes(m[2]) || / NIL$/.test(raw)) continue;
    const o = (out[m[2]] ??= {}), sn = (seen[m[2]] ??= {});
    if (m[1] !== 'TAF') {
      const d = obsTime(raw);
      if (d && (!sn.metar || d > sn.metar)) { sn.metar = d; o.metar = raw; }
    } else {
      const i = tafInfo(raw);
      if (!i || i.to <= now) continue;             // TAF expiré ou vieux message rediffusé
      const k = i.hours <= 12 ? 'tafc' : 'taf';    // TAF court / TAF long
      if (!sn[k] || i.issued >= sn[k]) { sn[k] = i.issued; o[k] = raw; }
    }
  }
  return out;
}

// Source C : NOAA aviationweather.gov via relais (METAR + TAF, une requête chacun)
async function srcNOAA(){
  const out = {}, base = 'https://aviationweather.gov/api/data/';
  const isArr = t => { try { return Array.isArray(JSON.parse(t)); } catch(e) { return false; } };
  const [m, t] = await Promise.all([
    fetchText(`${base}metar?ids=${IDS}&format=json&hours=3`, isArr),
    fetchText(`${base}taf?ids=${IDS}&format=json`, isArr),
  ]);
  if (m) JSON.parse(m).sort((x,y)=>x.obsTime-y.obsTime).forEach(x => (out[x.icaoId] ??= {}).metar = x.rawOb);
  if (t) JSON.parse(t).sort((x,y)=>x.issueTime>y.issueTime?1:-1).forEach(x => (out[x.icaoId] ??= {}).taf = x.rawTAF);
  return out;
}

// Fraîcheur : METAR publiés toutes les 30 min => en retard au-delà de 45 min ; TAF expiré si fin de validité passée
function freshness(data){
  const late = [], expired = [], now = Date.now();
  AD.forEach(a => {
    const d = data[a.id] || {};
    const m = d.metar?.match(/\s(\d{2})(\d{2})(\d{2})Z\s/);
    if (!m || (now - dayTime(+m[1], +m[2], +m[3])) / 6e4 > 45) late.push(a.id);
    for (const t of [d.taf, d.tafc]) {
      const v = t?.match(/\s\d{4}\/(\d{2})(\d{2})\s/);
      if (v) { const end = dayTime(+v[1], +v[2] % 24); if (+v[2] === 24) end.setUTCDate(end.getUTCDate() + 1); if (end < now) expired.push(a.id); }
    }
  });
  return {late, expired};
}
function setStatus(data, text){
  const el = document.getElementById('status');
  if (!data) { el.className = ''; el.textContent = text; return; }
  const {late, expired} = freshness(data);
  const issues = [];
  if (late.length) issues.push('METAR en retard : ' + late.join(' '));
  if (expired.length) issues.push('TAF expiré : ' + expired.join(' '));
  // un terrain sans TAF peut être normal (ex. LFMC) ; si la majorité manque, c'est la source qui est en panne
  const noTaf = AD.filter(a => !data[a.id]?.taf && !data[a.id]?.tafc).length > AD.length / 2;
  el.className = !issues.length && !noTaf ? 'ok' : late.length > AD.length / 2 || noTaf ? 'bad' : 'warn';
  el.textContent = (el.className === 'ok' ? '✓ À jour – ' : '⚠ ' + (issues.length ? issues.join(' – ') + ' – ' : '')) + text;
}

function render(data, status){
  AD.forEach(a => {
    const d = data[a.id] || {};
    const metar = d.metar ? strip(d.metar, /^(METAR|SPECI)\s+/) : null;
    const taf = d.taf ? strip(d.taf, /^TAF\s+/) : null;
    const tafc = d.tafc ? strip(d.tafc, /^TAF\s+/) : null;
    const col = metar ? terrainColor(metar) : null;
    const badge = a.card.querySelector('.tc');
    const lbl = a.marker.getElement()?.querySelector('.icao-lbl');
    if (col) {
      badge.textContent = col.n; badge.style.background = col.bg; badge.style.color = col.fg; badge.style.display = '';
      if (lbl) { lbl.style.background = col.bg; lbl.style.color = col.fg; }
    } else badge.style.display = 'none';
    // encart entier à la couleur terrain (bordure + bandeau titre)
    const h2 = a.card.querySelector('h2');
    a.card.style.borderColor = col ? (col.n === 'BLANC' ? '#9a9a9a' : col.bg) : '';
    h2.style.background = col ? col.bg : '';
    h2.style.color = col ? col.fg : '';
    a.color = col ? (col.n === 'BLANC' ? '#9a9a9a' : col.bg) : null;
    a.card.querySelector('.body').innerHTML =
      `<div><span class="lbl">METAR:</span> ${metar ? esc(metar) : '<span class="err">indisponible</span>'}</div>` +
      (tafc ? `<div class="taf"><span class="lbl">TAF COURT:</span> ${esc(tafc)}</div>` : '') +
      `<div class="taf"><span class="lbl">${tafc ? 'TAF LONG' : 'TAF'}:</span> ${taf ? esc(taf) : '<span class="err">indisponible</span>'}</div>`;
  });
  setStatus(TEST ? null : data, status);
  layout();
}

  LFMT: {metar:'METAR LFMT 231200Z 18005KT 0300 FG VV001 12/12 Q1015', taf:'TAF LFMT 231100Z 2312/2412 18005KT 0400 FG VV001 BECMG 2314/2316 3000 BR BKN005 TEMPO 2400/2408 0200 FG VV001'},  // ROUGE
  LFTW: {metar:'METAR LFTW 231200Z 20008KT 1200 BR OVC003 14/13 Q1016', taf:'TAF LFTW 231100Z 2312/2412 20008KT 1500 BR OVC003 BECMG 2315/2317 6000 BKN010'},                                     // AMBRE
  LFMO: {metar:'METAR LFMO 231200Z 34012KT 3000 -RA BKN004 15/13 Q1012', taf:'TAF LFMO 231100Z 2312/2412 34012KT 3000 -RA BKN004 TEMPO 2312/2316 1500 RA BKN003 BECMG 2318/2320 9999 SCT030'},     // JAUNE
  LFMV: {metar:'METAR LFMV 231200Z 36015G25KT 4500 SHRA BKN009 16/12 Q1013', taf:'TAF LFMV 231100Z 2312/2412 36015G25KT 5000 SHRA BKN009 PROB30 TEMPO 2312/2318 2000 TSRA BKN006CB'},              // VERT
  LFMY: {metar:'METAR LFMY 231200Z 32010KT 7000 BKN018 18/10 Q1014', taf:'TAF LFMY 231100Z 2312/2412 32010KT 7000 BKN018 BECMG 2314/2316 CAVOK'},                                                   // BLANC

  LFML: {metar:'METAR LFML 231200Z 31015KT 9999 SCT012 BKN030 21/09 Q1017', taf:'TAF LFML 231100Z 2312/2412 31015KT 9999 SCT012 BKN030'},                                                          // BLEU (SCT ignoré)
  LFMC: {metar:'METAR LFMC 231200Z 09005KT 1600 BR BKN008 13/12 Q1011', taf:'TAF LFMC 231100Z 2312/2412 09005KT 2000 BR BKN008'},                                                                  // JAUNE (limite 1600)
  LFTH: {metar:'METAR LFTH 231200Z 27008KT 9999 BKN006 17/14 Q1015', taf:'TAF LFTH 231100Z 2312/2412 27008KT 9999 BKN006 BECMG 2316/2318 BKN015'},                                                  // JAUNE (nuages 600 ft)
};
const TEST = new URLSearchParams(location.search).has('test');

let busy = false;
async function refresh(){
  if (TEST) { render(TEST_DATA, '⚠ MODE TEST – données fictives'); return; }
  if (busy) return; busy = true;
  const data = {}, from = {metar:{}, taf:{}};
  const hhmm = d => new Date(d).toISOString().slice(11,16) + 'Z';
  const summary = () => {
    const names = k => [...new Set(Object.values(from[k]))].join(' + ');
    const nT = Object.keys(from.taf).length;
    return `METAR via ${names('metar') || '—'} · TAF ${nT ? 'via ' + names('taf') : 'indisponibles (relais publics en panne)'} · ${hhmm(Date.now())}`;
  };
  // METAR : on garde le plus récent toutes sources confondues.
  // TAF : on garde le plus récemment émis (Ogimet a souvent les TAF amendés en premier).
  const tafIssued = v => Math.max(...[v.taf, v.tafc].filter(Boolean).map(t => tafInfo(t)?.issued || 0));
  const merge = (src, name) => {
    for (const [id, v] of Object.entries(src)) {
      const d = (data[id] ??= {});
      if (v.metar && (!d.metar || obsTime(v.metar) > obsTime(d.metar))) { d.metar = v.metar; from.metar[id] = name; }
      if ((v.taf || v.tafc) && (!(d.taf || d.tafc) || tafIssued(v) > tafIssued(d))) { d.taf = v.taf; d.tafc = v.tafc; from.taf[id] = name; }
    }
    render(data, summary() + ' – chargement…');
  };
  document.getElementById('status').textContent = 'Chargement des données…';
  await Promise.all([
    srcVATSIM().then(s => merge(s, 'VATSIM')),
    srcCheckWX().then(s => merge(s, 'CheckWX')),
    srcOgimet().then(s => merge(s, 'Ogimet')),
  ]);
  // NOAA seulement si Ogimet n'a pas tout donné
  if (IDS.some(id => !data[id]?.metar || (!data[id]?.taf && !data[id]?.tafc))) merge(await srcNOAA(), 'NOAA');
  render(data, summary() + ' – actualisé toutes les 5 min');
  busy = false;
}

applyCompact(); map.invalidateSize(); fit(); layout();
refresh();
// Actualisation toutes les 5 min, en pause quand l'onglet est caché (économise le quota CheckWX)
setInterval(() => { if (!document.hidden) refresh(); }, 5*60*1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
setTimeout(layout, 300);
</script>
