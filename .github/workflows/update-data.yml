# Récupère les METAR/TAF toutes les 10 min et les enregistre dans data.js
# (lu en priorité par index.html : même origine, donc pas de problème CORS)
name: Mise à jour METAR TAF

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Télécharger les données (Ogimet, secours NOAA)
        run: node scripts/update-data.js
      - name: Enregistrer
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data.js
          git diff --cached --quiet || (git commit -m "METAR/TAF $(date -u +%H%MZ)" && git push)
